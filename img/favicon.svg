<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- подложка-шина -->
  <circle cx="32" cy="32" r="31" fill="#171c22"/>

  <!-- обод: оранжевое кольцо -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#ff6b00" stroke-width="5"/>

  <!-- пять спиц: одна линия + точные повороты на 72° -->
  <g stroke="#e9edf2" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="11"/>
    <line x1="32" y1="32" x2="32" y2="11" transform="rotate(72 32 32)"/>
    <line x1="32" y1="32" x2="32" y2="11" transform="rotate(144 32 32)"/>
    <line x1="32" y1="32" x2="32" y2="11" transform="rotate(216 32 32)"/>
    <line x1="32" y1="32" x2="32" y2="11" transform="rotate(288 32 32)"/>
  </g>

  <!-- ступица -->
  <circle cx="32" cy="32" r="7" fill="#ff6b00"/>
</svg>